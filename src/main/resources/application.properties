# ============================================================
# HealthSync Hospital Management System
# Spring Boot Application Configuration — H2 In-Memory DB
# ============================================================

# Server
server.port=8080

# H2 In-Memory DataSource
spring.datasource.url=jdbc:h2:mem:healthsync;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging — visit /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate — create tables from entities
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Initialize data after schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.healthsync=INFO
logging.level.org.hibernate.SQL=WARN
